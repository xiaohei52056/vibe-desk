<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIBE DESK · 3D 星核与星环 · 实验</title>
<style>
  :root{
    --deep:#101720; --line:#3B4860; --warm:#EDE7DA; --gold:#C9A063;
    --ui:#7C8AA0; --dim:#5A6A82;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Source Han Sans CN","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--warm);
    font-family:var(--sans);-webkit-font-smoothing:antialiased}
  canvas{display:block;position:absolute;inset:0}
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;
    padding:16px 26px;font-family:var(--mono);font-size:10px;color:var(--ui);
    letter-spacing:.06em;pointer-events:none;z-index:5}
  #hud .b{color:var(--gold);letter-spacing:.14em}
  #hud .s{width:1px;height:11px;background:var(--line)}
  #hud .r{margin-left:auto;color:var(--dim);font-family:var(--mono)}
  #modes{position:absolute;left:26px;bottom:26px;z-index:6;display:flex;flex-direction:column;gap:2px}
  #modes button{display:flex;align-items:center;gap:11px;padding:8px 14px 8px 11px;
    background:rgba(26,36,50,.82);border:1px solid rgba(90,106,130,.4);border-radius:3px;
    color:var(--ui);font-family:var(--sans);font-size:12px;cursor:pointer;text-align:left;
    transition:color 200ms,border-color 200ms,background 200ms;min-width:270px}
  #modes button kbd{font-family:var(--mono);font-size:10px;color:var(--dim);
    border:1px solid rgba(90,106,130,.5);border-radius:2px;padding:1px 5px}
  #modes button em{font-style:normal;margin-left:auto;font-family:var(--mono);
    font-size:9.5px;color:var(--dim);letter-spacing:.04em}
  #modes button:hover{border-color:rgba(201,160,99,.5);color:var(--warm)}
  #modes button.on{background:rgba(201,160,99,.1);border-color:rgba(201,160,99,.6);color:var(--warm)}
  #modes button.on kbd{color:var(--gold);border-color:rgba(201,160,99,.55)}
  #note{position:absolute;right:26px;bottom:26px;max-width:330px;z-index:6;
    font-size:11.5px;line-height:1.85;color:var(--dim);text-align:right}
  #note b{display:block;color:var(--warm);font-weight:400;font-size:12px;margin-bottom:5px}
  #tip{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
    font-family:var(--mono);font-size:9.5px;color:rgba(90,106,130,.85);letter-spacing:.08em;
    z-index:6;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <span class="b">VIBE DESK</span>
  <span class="s"></span>
  <span>3D 星核与星环 · 实验台</span>
  <span class="s"></span>
  <span id="mode-name">暖墨</span>
  <span class="r" id="stats">—</span>
</div>

<div id="modes">
  <button data-mode="ink" class="on"><kbd>1</kbd>暖墨 · 常规混合 + 景深雾气<em>与现有视觉同源</em></button>
  <button data-mode="hybrid"><kbd>2</kbd>折中 · 环不发光，核发光<em>只在星核上用叠加</em></button>
  <button data-mode="glow"><kbd>3</kbd>叠加 · 全面 Additive<em>参考项目做法</em></button>
</div>

<div id="note">
  <b>三种混合模式，同一套几何</b>
  星核只有一个 <i>neural shell</i>，星环共 9 层。差别只在混合方式与配色——
  几何一行不改，视觉基因却完全不同。
</div>

<div id="tip">拖动旋转 · 滚轮推拉 · 1 / 2 / 3 切换混合</div>

<script type="module" src="/src/lab/core3d.ts"></script>
</body>
</html>
